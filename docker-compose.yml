services:
  proxy:
    image: traefik
    restart: always
    env_file:
      - .env
    networks:
      - proxy
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --log.level=DEBUG
    labels:
      - traefik.enable=true
      - traefik.http.routers.proxy.rule=Host(`proxy.${DOMAIN_ZONE}`)
      - traefik.http.routers.proxy.entrypoints=web,websecure
      - traefik.http.routers.proxy.tls=${HTTPS_ENABLED}
      - traefik.http.services.proxy.loadbalancer.server.port=8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ./certs:/etc/traefik/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  portainer:
    image: portainer/portainer-ce
    restart: always
    command: -H unix:///var/run/docker.sock --http-enabled
    env_file:
      - .env
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_ZONE}`)
      - traefik.http.routers.portainer.entrypoints=web,websecure
      - traefik.http.routers.portainer.tls=${HTTPS_ENABLED}
      - traefik.http.services.portainer.loadbalancer.server.port=9000

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    networks:
      - proxy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: Admin1234
    labels:
      - traefik.enable=true
      - traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMAIN_ZONE}`)
      - traefik.http.routers.pgadmin.entrypoints=web,websecure
      - traefik.http.routers.pgadmin.tls=${HTTPS_ENABLED}
      - traefik.http.services.pgadmin.loadbalancer.server.port=80

  mailpit:
    image: axllent/mailpit
    restart: always
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mails.${DOMAIN_ZONE:-localhost}`)
      - traefik.http.routers.mailpit.entrypoints=web,websecure
      - traefik.http.routers.mailpit.tls=${HTTPS_ENABLED}
      - traefik.http.services.mailpit.loadbalancer.server.port=8025

  redisinsight:
    image: redis/redisinsight
    restart: always
    networks:
      - proxy
    volumes:
      - redisinsight-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.redisinsight.rule=Host(`redis.${DOMAIN_ZONE:-localhost}`)
      - traefik.http.routers.redisinsight.entrypoints=web,websecure
      - traefik.http.routers.redisinsight.tls=${HTTPS_ENABLED}
      - traefik.http.services.redisinsight.loadbalancer.server.port=5540

networks:
  proxy:
    name: proxy
    driver: bridge

volumes:
  redisinsight-data: